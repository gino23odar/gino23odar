 <text x="79" y="190" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F4F8FF">ask "What is Gino's Playwright experience?"</text>
 <path d="M51 209 H1138" stroke="#2C445B"/>
 <text x="51" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DDEEFF">Example knowledge-base response</text>
 <text x="51" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#CADDED">Playwright UI and end-to-end testing, staging investigations, regression</text>
 <text x="51" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#CADDED">testing, and debugging across services, APIs and browser interactions.</text>
 <text x="51" y="330" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#8CE3D2">SOURCE  public portfolio facts  <tspan fill="#94ABC1">|</tspan>  MODE  GitHub Issue replies</text>
 <text x="32" y="379" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#AAC1D7">This is a visual preview, not an input. Use the clickable commands and Ask link below.</text>
