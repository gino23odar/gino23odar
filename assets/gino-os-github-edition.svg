<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="396" viewBox="0 0 1200 396" role="img" aria-labelledby="title desc">
 <title id="title">GINO.OS GitHub Edition terminal interface</title>
 <desc id="desc">Terminal illustration. Clickable Markdown commands and a GitHub Issue form below it provide actual interaction after publishing.</desc>
