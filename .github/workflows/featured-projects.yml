name: Update featured projects

on:
  push:
    paths:
      - 'config/projects.json'
      - 'scripts/generate_featured.py'
      - '.github/workflows/featured-projects.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: featured-projects
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project gallery generator
        run: python -m unittest discover -s tests -v
      - name: Render project cards and README
        run: python scripts/generate_featured.py
      - name: Commit changed generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh featured project gallery'
            git push
          fi
